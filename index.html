<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111827">
  <title>Paso a paso · Ranking</title>
  <link rel="stylesheet" href="src/css/style.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="#" aria-label="Paso a paso, inicio">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" fill="none"><path d="M12.4 4.7c2.4-.7 5 .8 5.7 3.2l2.2 7.7c.5 1.8-.5 3.6-2.2 4.1-1.6.5-3.4-.4-4-2l-1.2-3.5-3.1 1.1c-2 .7-4.1-.4-4.8-2.4-.7-2 .4-4.1 2.4-4.8l5-1.8Z" fill="#6EE7B7"/><path d="m18.7 19.8 4.2-2.1a3.7 3.7 0 0 1 4.9 1.6l.3.6a3.7 3.7 0 0 1-1.6 4.9l-7.3 3.7a4.5 4.5 0 0 1-6-2l-1.1-2.3" fill="#38BDF8"/></svg>
        </span>
        <span>Paso<span class="brand-accent">a</span>paso</span>
      </a>
      <div class="topbar-actions">
        <button class="icon-button" id="theme-toggle" type="button" aria-label="Cambiar tema">
          <svg class="icon icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32 1.41 1.41M2 12h2m16 0h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
          <svg class="icon icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A8.5 8.5 0 1 1 11.2 3 6.7 6.7 0 0 0 21 12.8Z"/></svg>
        </button>
      </div>
    </header>

    <main>
      <section class="welcome-section" id="welcome-screen">
        <div class="hero-copy">
          <span class="eyebrow"><span class="eyebrow-dot"></span> Competición amistosa</span>
          <h1>Un paso más.<br><em>Cada día.</em></h1>
          <p>Elige tu perfil para ver cómo va el ranking y mantener a todo el equipo en movimiento.</p>
        </div>
        <div class="people-grid" id="people-grid" aria-label="Selecciona tu persona"></div>
      </section>

      <section class="dashboard hidden" id="dashboard">
        <div class="dashboard-heading">
          <div>
            <span class="eyebrow"><span class="eyebrow-dot"></span> Tu resumen</span>
            <h1>Hola, <span id="current-person">Jorge</span></h1>
          </div>
          <button class="change-person" id="change-person" type="button">Cambiar perfil <span>→</span></button>
        </div>

        <section class="hero-card">
          <div class="hero-card-content">
            <span class="card-label">Tus pasos de hoy</span>
            <strong id="personal-today">0</strong>
            <span class="goal-copy"><span id="goal-progress">0%</span> de tu objetivo diario</span>
            <div class="progress-track"><span id="personal-progress"></span></div>
          </div>
          <div class="hero-card-art" aria-hidden="true">
            <svg viewBox="0 0 130 130" fill="none"><circle cx="65" cy="65" r="53" stroke="rgba(255,255,255,.18)" stroke-width="1"/><circle cx="65" cy="65" r="40" stroke="rgba(255,255,255,.18)" stroke-width="1"/><path d="M48 36c9-3 18 2 21 11l7 23c2 6-2 12-8 14l-2 .6c-5 1.5-10-1.4-11.5-6.4l-3.2-11-7.7 2.2c-7 2-14-2-16-9s2-14 9-16l12-3.4Z" fill="#6EE7B7"/><path d="m66 84 17-8a11 11 0 0 1 14 5l.8 1.7a11 11 0 0 1-5 14l-20 9.8a13 13 0 0 1-17-5.8l-3-6.2" fill="#38BDF8"/></svg>
          </div>
        </section>

        <section class="section-block">
          <div class="section-heading">
            <div><span class="eyebrow"><span class="eyebrow-dot"></span> Clasificación</span><h2>¿Quién lidera?</h2></div>
            <div class="period-tabs" role="tablist" aria-label="Periodo del ranking">
              <button class="period-tab active" data-period="day" role="tab" type="button">Hoy</button>
              <button class="period-tab" data-period="week" role="tab" type="button">Semana</button>
              <button class="period-tab" data-period="all" role="tab" type="button">Histórico</button>
            </div>
          </div>
          <div class="ranking-list" id="ranking-list"></div>
        </section>

        <section class="section-block add-steps-section">
          <div class="section-heading compact"><div><span class="eyebrow"><span class="eyebrow-dot"></span> Registrar actividad</span><h2>Suma tus pasos</h2></div></div>
          <form class="steps-form" id="steps-form">
            <label>Persona<select id="person-select"></select></label>
            <label>Fecha<input id="steps-date" type="date" required></label>
            <label class="steps-input">Pasos<input id="steps-input" type="number" min="0" max="200000" placeholder="0" required></label>
            <button class="primary-button" type="submit"><span>Guardar pasos</span><span aria-hidden="true">+</span></button>
          </form>
          <p class="form-message" id="form-message" role="status"></p>
        </section>
      </section>
    </main>
    <footer><span>Hecho para moverse</span><span class="footer-line"></span><span id="footer-year"></span></footer>
  </div>
  <button class="back-to-top" id="back-to-top" type="button" aria-label="Volver arriba">↑</button>
  <script type="module" src="src/app.js"></script>
</body>
</html>
